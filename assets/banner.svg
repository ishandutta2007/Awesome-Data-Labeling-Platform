<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:48px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#cbd5e1}.anim-float{animation:float 6s ease-in-out infinite}.anim-dash{stroke-dasharray:10,10;animation:dash 20s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g stroke="#334155" stroke-width="1" opacity=".25"><path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/><path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400"/></g><g fill="none" stroke="url(#accentGrad)" stroke-width="1.5" class="anim-dash" opacity=".4"><path d="M 150 80 L 300 280 L 500 120 L 750 300 L 1050 100"/><path d="M 100 320 L 450 60 L 850 220 L 1100 340"/></g><circle cx="200" cy="100" r="120" fill="#6366f1" filter="url(#glow)" opacity=".15"/><circle cx="1000" cy