<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #cbd5e1;
    }
    .anim-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .anim-float {
      animation: float 6s ease-in-out infinite;
    }
    .anim-dash {
      stroke-dasharray: 10, 10;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400"/>
  </g>

  <!-- Background Dynamic Element: Network / Bounding Box Connections -->
  <g class="anim-dash" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 150 80 L 300 280 L 500 120 L 750 300 L 1050 100"/>
    <path d="M 100 320 L 450 60 L 850 220 L 1100 340"/>
  </g>

  <!-- Background Animated Glow Blobs (Kept behind foreground elements) -->
  <circle cx="200" cy="100" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>

  <!-- Background Visual Pills (Lower Opacity / Z-index) -->
  <g opacity="0.35" class="anim-float">
    <!-- Simulated Image Bounding Box -->
    <rect x="820" y="70" width="260" height="170" rx="8" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,6"/>
    <rect x="820" y="48" width="110" height="22" rx="4" fill="#818cf8"/>
    <text x="830" y="63" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">Object: Car (98%)</text>
    
    <!-- Simulated Polygon Annotation Points -->
    <polygon points="880,110 960,95 1040,150 990,210 900,190" fill="url(#accentGrad)" fill-opacity="0.2" stroke="#f472b6" stroke-width="2"/>
    <circle cx="880" cy="110" r="4" fill="#ffffff"/>
    <circle cx="960" cy="95" r="4" fill="#ffffff"/>
    <circle cx="1040" cy="150" r="4" fill="#ffffff"/>
    <circle cx="990" cy="210" r="4" fill="#ffffff"/>
    <circle cx="900" cy="190" r="4" fill="#ffffff"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitle (Guaranteed high visibility and contrast) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="url(#accentGrad)"/>
      <text x="140" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">🏷️ DATA LABELING ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">
      Awesome <tspan fill="url(#accentGrad)">Data Labeling</tspan> Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Annotation Tools
    </text>

    <!-- Key Feature Pills in Foreground -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="80" y="24" text-anchor="middle" class="badge-text">⚡ Model-Assisted</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="160" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="255" y="24" text-anchor="middle" class="badge-text">👁️ Computer Vision</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="140" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="420" y="24" text-anchor="middle" class="badge-text">📝 NLP &amp; LLMs</text>

      <!-- Pill 4 -->
      <rect x="505" y="0" width="160" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="585" y="24" text-anchor="middle" class="badge-text">🌐 Open Source &amp; SaaS</text>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(0, 335)">
      <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="600">
        UPDATED OCTOBER 2026 • CREATED FOR ML ENGINEERS &amp; DATA ANNOTATORS
      </text>
    </g>
  </g>
</svg>
